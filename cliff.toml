# git-cliff configuration for DataForge
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to **DataForge** will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = [
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "" },
]
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^(feat|fix)\\((i18n|l10n)\\)", group = "<!-- 3 -->Localization (i18n)" },
  { message = "^i18n", group = "<!-- 3 -->Localization (i18n)" },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 4 -->Refactoring" },
  { message = "^docs", group = "<!-- 5 -->Documentation" },
  { message = "^ci", group = "<!-- 6 -->CI / CD" },
  { message = "^build", group = "<!-- 7 -->Build & Dependencies" },
  { message = "^chore\\(deps.*\\)", group = "<!-- 7 -->Build & Dependencies" },
  { message = "^chore", group = "<!-- 8 -->Maintenance" },
  { message = "^test", group = "<!-- 9 -->Testing" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
