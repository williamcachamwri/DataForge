name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  windows-release-ci:
    name: Windows Release Check, Test & Smoke
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: >
          cargo fmt
          -p tableminus-windows-platform
          -p tableminus-state
          -p tableminus-gfx
          -p tableminus-services
          -p tableminus-windows-app
          -p tableminus-e2e
          -- --check

      - name: Run Clippy (release, all targets)
        run: >
          cargo clippy --release --no-deps --all-targets
          -p tableminus-windows-platform
          -p tableminus-state
          -p tableminus-gfx
          -p tableminus-services
          -p tableminus-windows-app
          -p tableminus-e2e
          -- -D warnings

      - name: Test tableminus-windows-platform (release)
        run: cargo test --release -p tableminus-windows-platform

      - name: Test tableminus-state (release)
        run: cargo test --release -p tableminus-state

      - name: Test tableminus-services (release)
        run: cargo test --release -p tableminus-services

      - name: Test tableminus-windows-app (unit + integration parity suites)
        run: >
          cargo test --release -p tableminus-windows-app
          --lib
          --test startup_shell
          --test layout_hit_test
          --test keyboard_nav
          --test live_wiring
          --test app_model_parity
          --test editor_and_grid_parity
          --test workbench_parity_tools

      - name: Test tableminus-e2e (self-contained release suites)
        run: >
          cargo test --release -p tableminus-e2e
          --test sqlite_e2e
          --test duckdb_e2e
          --test import_e2e
          --test workflow_e2e
          --test startup_perf_e2e
          --test grid_perf_and_interop_e2e

      - name: Build release binary
        run: cargo build --release -p tableminus-windows-app

      - name: Verify smoke startup
        run: .\target\release\tableminus.exe --smoke-startup

      - name: Run screenshot tour
        continue-on-error: true
        run: .\crates\tableminus-windows-app\tests\screenshots\run-tour.ps1 -PrepareDesktop

      - name: Upload screenshot tour artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tableminus-screenshots
          path: target/screenshots/tableminus-screenshots.zip
          if-no-files-found: warn
          retention-days: 14
