name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  windows-release-ci:
    name: Windows Release Check, Test & Smoke
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: >
          cargo fmt
          -p dataforge-windows-platform
          -p dataforge-state
          -p dataforge-gfx
          -p dataforge-services
          -p dataforge-windows-app
          -p dataforge-e2e
          -- --check

      - name: Run Clippy (release)
        run: >
          cargo clippy --release --no-deps
          -p dataforge-windows-platform
          -p dataforge-state
          -p dataforge-gfx
          -p dataforge-services
          -p dataforge-windows-app
          -- -D warnings

      - name: Run unit tests (release)
        run: >
          cargo test --release
          -p dataforge-windows-platform
          -p dataforge-state
          -p dataforge-services
          -p dataforge-windows-app
          --lib

      - name: Run app integration tests (release)
        run: >
          cargo test --release
          -p dataforge-windows-app
          --test startup_shell
          --test layout_hit_test

      - name: Build release binary
        run: cargo build --release -p dataforge-windows-app

      - name: Verify smoke startup
        run: .\target\release\dataforge.exe --smoke-startup
